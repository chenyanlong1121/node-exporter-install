---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    k8s.kuboard.cn/service: NodePort
    k8s.kuboard.cn/workload: monitor-pushgateway
  labels:
    k8s.kuboard.cn/layer: monitor
    k8s.kuboard.cn/name: monitor-pushgateway
  name: monitor-pushgateway
  namespace: monitoring
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      k8s.kuboard.cn/layer: monitor
      k8s.kuboard.cn/name: monitor-pushgateway
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        k8s.kuboard.cn/layer: monitor
        k8s.kuboard.cn/name: monitor-pushgateway
    spec:
      containers:
        - args:
            - '--web.enable-lifecycle'
          command:
            - sh
            - '-c'
            - /bin/pushgateway --web.config.file=/pushgateway/config.yml
          image: 'docker-registry.supconit.com/library/pushgateway:v1.4.3'
          imagePullPolicy: IfNotPresent
          name: pushgateway
          resources: {}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  annotations: {}
  name: monitor-pushgateway
  namespace: monitoring
spec:
  externalTrafficPolicy: Cluster
  ports:
    - nodePort: 30009
      port: 9091
      protocol: TCP
      targetPort: 9091
  selector:
    k8s.kuboard.cn/layer: monitor
    k8s.kuboard.cn/name: monitor-pushgateway
  sessionAffinity: None
  type: NodePort

